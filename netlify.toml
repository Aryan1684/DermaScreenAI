# Netlify configuration – the site is deployed as a fully static export (no server, no functions).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_STATIC_EXPORT = "1"
  NEXT_TELEMETRY_DISABLED = "1"

# Model files are large and never change between deploys of the same model version.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self)"
