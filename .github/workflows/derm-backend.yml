name: Verify Derm Foundation raw-image backend
on:
  pull_request:
    branches: [main]
    paths: ['backend/**','training/train_derm_foundation.py','.github/workflows/derm-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Prepare authorized model and head
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python backend/prepare_runtime.py
      - name: Check raw image embedding and classifier
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m backend.smoke_test
      - name: Verify HTTP API
        run: |
          uvicorn backend.app:app --host 127.0.0.1 --port 7860 --no-access-log &
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:7860/health && break; sleep 2; done
          curl -fsS https://storage.googleapis.com/dx-scin-public-data/dataset/images/3445096909671059178.png -o /tmp/sample.png
          curl --fail -sS -H 'Origin: https://dermascreenai.netlify.app' -H 'Content-Type: image/png' --data-binary @/tmp/sample.png http://127.0.0.1:7860/predict
