name: Derm Foundation classifier
on:
  pull_request:
    branches: [main]
    paths: ['training/train_derm_foundation.py', '.github/workflows/derm-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Check gated model access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Accept the Derm Foundation terms and add HF_TOKEN as a repository secret, then rerun this job."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training environment
        run: pip install numpy==1.26.4 scikit-learn==1.5.2 huggingface_hub==0.27.1 pillow==10.4.0
      - name: Fetch SCIN metadata
        run: |
          mkdir -p /tmp/scin
          curl --fail --retry 3 -L https://storage.googleapis.com/dx-scin-public-data/dataset/scin_cases.csv -o /tmp/scin/cases.csv
          curl --fail --retry 3 -L https://storage.googleapis.com/dx-scin-public-data/dataset/scin_labels.csv -o /tmp/scin/labels.csv
      - name: Train classifier on precomputed embeddings
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python training/train_derm_foundation.py --csv-dir /tmp/scin --out derm-output
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: derm-foundation-evaluation
          path: derm-output/metrics.json
          retention-days: 7
